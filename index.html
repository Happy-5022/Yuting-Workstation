<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Happy赖工作台</title>
  <meta name="description" content="玉婷的个人创作+学习工作台" />
  <meta name="theme-color" content="#0E9C8E" />
  <!-- 苹果主屏幕 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="玉婷台" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>
  <div id="app">
    <!-- 左侧抽屉 -->
    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div class="drawer-logo">🌿</div>
        <div>
          <div class="drawer-title">Happy赖工作台</div>
          <div class="drawer-sub">创作 · 学习 · 生活</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="drawer-foot">
        <div id="storageNote" class="storage-note">数据只存在这台手机里</div>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <!-- 主区域 -->
    <div id="main" class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="打开菜单">☰</button>
        <div id="pageTitle" class="page-title">每日计划</div>
        <div id="dateLabel" class="date-label"></div>
        <button id="homeBtn" class="icon-btn" aria-label="回到首页">🏠</button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast"></div>

  <script src="js/db.js?v=8"></script>
  <script src="js/vn-data.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1480" width="1080" height="1480" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 纸张底色 -->
  <rect x="0" y="0" width="1080" height="1480" fill="#FBF6EF"/>

  <!-- 标题 -->
  <text x="540" y="82" text-anchor="middle" font-size="46" font-weight="700" fill="#3A322A">我是怎么搭起个人工作台的？</text>
  <text x="540" y="126" text-anchor="middle" font-size="27" fill="#967050">四步走 · 一下午就能用上</text>
  <path d="M372 146 q 28 -11 56 0 t 56 0 t 56 0 t 56 0 t 56 0 t 56 0" stroke="#C9A06A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 小星点缀 -->
  <path d="M300 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#E9B84B"/>
  <path d="M788 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#E9B84B"/>

  <!-- 步骤 1 -->
  <g filter="url(#soft)">
    <rect x="140" y="160" width="800" height="190" rx="26" fill="#E3F5F1" stroke="#2BB3A3" stroke-width="3"/>
  </g>
  <circle cx="215" cy="255" r="40" fill="#0E9C8E"/>
  <text x="215" y="255" text-anchor="middle" dominant-baseline="central" font-size="42" font-weight="700" fill="#ffffff">1</text>
  <text x="285" y="237" font-size="34" font-weight="700" fill="#3A322A">想清楚要啥</text>
  <text x="285" y="285" font-size="25" fill="#6B5D50">先列 3 个真用得上的功能，别一上来就贪多</text>

  <!-- 箭头 1 -->
  <path d="M540 358 C 525 376, 555 386, 540 400" stroke="#C9A06A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M530 392 L540 404 L550 392" stroke="#C9A06A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 步骤 2 -->
  <g filter="url(#soft)">
    <rect x="140" y="405" width="800" height="190" rx="26" fill="#FFEEE3" stroke="#FF8A5B" stroke-width="3"/>
  </g>
  <circle cx="215" cy="500" r="40" fill="#FF7A45"/>
  <text x="215" y="500" text-anchor="middle" dominant-baseline="central" font-size="42" font-weight="700" fill="#ffffff">2</text>
  <text x="285" y="482" font-size="34" font-weight="700" fill="#3A322A">跟 AI 说人话</text>
  <text x="285" y="530" font-size="25" fill="#6B5D50">把想要的功能用大白话告诉 AI 搭子，它来生成网页</text>

  <!-- 箭头 2 -->
  <path d="M540 603 C 525 621, 555 631, 540 645" stroke="#C9A06A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M530 637 L540 649 L550 637" stroke="#C9A06A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 步骤 3 -->
  <g filter="url(#soft)">
    <rect x="140" y="650" width="800" height="190" rx="26" fill="#E7F0FD" stroke="#5B8DEF" stroke-width="3"/>
  </g>
  <circle cx="215" cy="745" r="40" fill="#3E7BE0"/>
  <text x="215" y="745" text-anchor="middle" dominant-baseline="central" font-size="42" font-weight="700" fill="#ffffff">3</text>
  <text x="285" y="727" font-size="34" font-weight="700" fill="#3A322A">发到网上</text>
  <text x="285" y="775" font-size="25" fill="#6B5D50">一键云发布，或用自己的 GitHub Pages 部署</text>

  <!-- 箭头 3 -->
  <path d="M540 848 C 525 866, 555 876, 540 890" stroke="#C9A06A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M530 882 L540 894 L550 882" stroke="#C9A06A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 步骤 4 -->
  <g filter="url(#soft)">
    <rect x="140" y="895" width="800" height="190" rx="26" fill="#EAF6E6" stroke="#7BBF6A" stroke-width="3"/>
  </g>
  <circle cx="215" cy="990" r="40" fill="#5DA84B"/>
  <text x="215" y="990" text-anchor="middle" dominant-baseline="central" font-size="42" font-weight="700" fill="#ffffff">4</text>
  <text x="285" y="972" font-size="34" font-weight="700" fill="#3A322A">装到主屏</text>
  <text x="285" y="1020" font-size="25" fill="#6B5D50">加到手机主屏，没网也能打开，像个小 App</text>

  <!-- 底部金句条 -->
  <g filter="url(#soft)">
    <rect x="140" y="1150" width="800" height="140" rx="24" fill="#FFF3E0" stroke="#F0C98A" stroke-width="3"/>
  </g>
  <text x="540" y="1202" text-anchor="middle" font-size="32" font-weight="700" fill="#B5793A">三句大实话</text>
  <text x="540" y="1250" text-anchor="middle" font-size="26" fill="#6B5D50">先来 3 个　·　卡住问 AI　·　记得备份</text>

  <!-- 落款 -->
  <text x="540" y="1360" text-anchor="middle" font-size="22" fill="#B0A090">Happy赖 · 个人工作台搭建</text>
</svg>
